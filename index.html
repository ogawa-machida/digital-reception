<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F6FA">
<title>避難所受付</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<style>
*,*:before,*:after{box-sizing:border-box}:root{--paper:#F3F6FA;--grid:rgba(46,111,216,.075);--ink:#1E3350;--sub:#5B6B82;--line:#CBD7E6;--card:#fff;--accent:#2E6FD8;--soft:#E3ECFA;--green:#2F8F66;--green-soft:#E5F4ED;--gold:#C98A17;--gold-soft:#FBF0D9;--red:#C94A3D;--shadow:0 1px 0 rgba(30,51,80,.06)}
body{margin:0;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;font-family:"Zen Maru Gothic","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}.wrap{max-width:760px;margin:auto;padding:20px 16px 110px}h1{font-size:1.8rem;font-weight:900;margin:4px 0}h2{font-size:1.05rem;margin:28px 0 10px;display:flex;align-items:center;gap:10px}h2:after{content:"";flex:1;border-top:1.5px dashed var(--line)}p{margin:0}.lead,.muted{color:var(--sub)}.muted{font-size:.86rem}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.btn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;min-height:48px;cursor:pointer}.btn.big{width:100%;min-height:58px;font-size:1.05rem}.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}.btn.green{background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.9rem}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}.hero{padding-top:16px}.hero-mark{width:62px;height:62px;border-radius:18px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:30px;margin-bottom:12px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice button{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.choice button strong{display:block;color:var(--accent);font-size:1.02rem;margin-bottom:3px}.steps{display:flex;gap:6px;margin:18px 0}.steps i{height:5px;flex:1;border-radius:99px;background:var(--line)}.steps i.on{background:var(--accent)}label{display:block;color:var(--sub);font-size:.86rem;margin:12px 0 4px}input,select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;min-height:46px;color:var(--ink)}textarea{min-height:82px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card-reader{text-align:center;padding:28px 16px}.reader-icon{width:130px;height:82px;border:2px solid var(--accent);border-radius:15px;margin:6px auto 20px;position:relative;background:var(--soft)}.reader-icon:after{content:"";position:absolute;width:48px;height:32px;border:2px solid var(--accent);border-radius:5px;left:39px;top:22px;background:#fff}.waves{font-size:1.5rem;color:var(--accent);font-weight:900;letter-spacing:-3px}.ok{background:var(--green-soft);border-color:#BBDCCB}.ok h2{color:var(--green);margin-top:0}.qrbox{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px auto;max-width:310px}.qrbox canvas{max-width:100%;height:auto}.ticket{border-left:5px solid var(--accent)}.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:.92rem}.kv div:nth-child(odd){color:var(--sub)}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.78rem;font-weight:700}.badge.green{background:var(--green-soft);color:var(--green)}.list{display:flex;flex-direction:column;gap:8px}.person{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.person small{display:block;color:var(--sub)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:1.45rem;display:block}.stat small{color:var(--sub)}.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.tabs button{border:0;background:none;padding:9px 4px;color:var(--sub);font:inherit;min-height:58px}.tabs button.on{color:var(--accent);font-weight:700}.checkrow{display:flex;gap:8px;flex-wrap:wrap}.checkrow label{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--ink)}.checkrow input{width:auto;min-height:0}.notice{font-size:.82rem;color:var(--sub);border-left:3px solid var(--gold);padding-left:10px}.danger-note{color:var(--red);font-size:.82rem}.hide{display:none!important}@media(max-width:520px){.choice,.two{grid-template-columns:1fr}.kv{grid-template-columns:90px 1fr}.stats{grid-template-columns:1fr 1fr}.wrap{padding-top:14px}}
</style></head>
<body><main class="wrap" id="app"></main><nav class="tabs" id="tabs"><button onclick="go('reception')" data-tab="reception">⌁<br>受付</button><button onclick="go('people')" data-tab="people">☷<br>避難者</button><button onclick="go('summary')" data-tab="summary">◫<br>状況</button></nav>
<script>
const $=s=>document.querySelector(s), h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='hinan-reception-poc-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"people":[]}'),view='reception',draft={};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now();
function layout(body){$('#app').innerHTML=body;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));}
function go(v){view=v;render();scrollTo(0,0)}
function render(){const token=new URLSearchParams(location.search).get('token');if(token){document.querySelector('#tabs').classList.add('hide');return mobileForm(token)}document.querySelector('#tabs').classList.remove('hide');({reception:home,people:people,summary:summary}[view]||home)()}
function home(){layout(`<section class="hero"><div class="hero-mark">⌁</div><h1>避難所受付</h1><p class="lead">カードをかざして、すばやく受付。<br>詳しい情報はあとからスマートフォンでも登録できます。</p></section><h2>受付をはじめる</h2><div class="panel"><button class="btn big" onclick="cardStart()">マイナンバーカードで受付</button><p class="muted" style="margin-top:9px;text-align:center">SONY PaSoRi RC-S300</p></div><div class="choice"><button onclick="manualStart()"><strong>カードを持っていない方</strong><span class="muted">氏名・住所を入力して受付</span></button><button onclick="quickDemo()"><strong>デモ受付</strong><span class="muted">PoC確認用のサンプル読取</span></button></div><h2>端末の状態</h2><div class="status"><span class="dot"></span><div><b>受付端末は利用できます</b><br><span class="muted">データはこの端末にも保存されます</span></div></div><p class="notice" style="margin-top:16px">このPoCはRC-S300の画面・受付フロー確認用です。ブラウザからカード情報を直接読む部分は、実運用時に専用クライアント／自治体向け方式と接続します。</p>`)}
function steps(n){return `<div class="steps">${[1,2,3].map(x=>`<i class="${x<=n?'on':''}"></i>`).join('')}</div>`}
function cardStart(){layout(`${steps(1)}<h1>カードをかざしてください</h1><p class="lead">マイナンバーカードをPaSoRiの中央に置いてください。</p><div class="panel card-reader"><div class="reader-icon"></div><div class="waves">)))</div><p style="margin:10px 0"><b>カードを待っています</b></p><p class="muted">読み取りが終わるまでカードを動かさないでください。</p></div><button class="btn big" onclick="quickDemo()">読取成功をデモする</button><button class="btn ghost big" style="margin-top:10px" onclick="home()">戻る</button>`)}
function quickDemo(){draft={name:'佐々木 太郎',address:'東京都町田市小川1-2-3',birth:'1976-04-15',sex:'男性',source:'マイナンバーカード',origin:'demo'};confirmBasic()}
function manualStart(){draft={source:'手入力'};layout(`${steps(1)}<h1>基本情報を入力</h1><p class="lead">受付に必要な最低限の情報を入力します。</p><div class="panel"><label>氏名</label><input id="name" autocomplete="name"><label>住所</label><input id="address" autocomplete="street-address"><div class="two"><div><label>生年月日</label><input id="birth" type="date"></div><div><label>性別</label><select id="sex"><option value="">選択しない</option><option>男性</option><option>女性</option><option>その他・回答しない</option></select></div></div></div><button class="btn big" onclick="manualNext()">確認へ</button>`)}
function manualNext(){draft={name:$('#name').value.trim(),address:$('#address').value.trim(),birth:$('#birth').value,sex:$('#sex').value,source:'手入力'};if(!draft.name)return alert('氏名を入力してください');confirmBasic()}
function confirmBasic(){layout(`${steps(2)}<h1>受付内容を確認</h1><p class="lead">内容を確認して受付を完了してください。</p><div class="panel ticket"><span class="badge">${h(draft.source)}</span><div class="kv" style="margin-top:12px"><div>氏名</div><b>${h(draft.name)}</b><div>住所</div><span>${h(draft.address||'—')}</span><div>生年月日</div><span>${h(draft.birth||'—')}</span><div>性別</div><span>${h(draft.sex||'—')}</span></div></div><div class="panel"><label>現在の避難状況</label><select id="status"><option>避難所にいる</option><option>車中泊</option><option>在宅避難</option></select></div><button class="btn big green" onclick="complete()">受付を完了する</button><button class="btn ghost big" style="margin-top:10px" onclick="${draft.origin==='demo'?'home()':(draft.source==='手入力'?'manualStart()':'cardStart()')}">戻る</button>`)}
function complete(){const p={id:uid(),token:uid().replaceAll('-',''),...draft,status:$('#status').value,createdAt:new Date().toISOString(),detail:false};state.people.unshift(p);save();done(p)}
function done(p){layout(`${steps(3)}<div class="panel ok"><h2>✓ 受付が完了しました</h2><p><b>${h(p.name)}さん</b></p><p class="muted">受付番号 ${h(p.id.slice(0,8).toUpperCase())}</p></div><h2>詳しい情報を登録</h2><p class="lead">お手持ちのスマートフォンでQRコードを読み取ると、同行者や支援に必要な情報を登録できます。</p><div class="qrbox"><canvas id="qr"></canvas><p class="muted" style="margin-top:8px">追加登録は後からでもできます</p></div><p class="notice">QRコードに氏名・住所・マイナンバーは含めません。受付用の一時トークンのみを使用します。</p><button class="btn big" style="margin-top:18px" onclick="home()">次の方を受付</button>`);const url=location.href.split('?')[0]+'?token='+encodeURIComponent(p.token);if(window.QRCode)QRCode.toCanvas($('#qr'),url,{width:230,margin:1});else $('#qr').outerHTML='<p>'+h(url)+'</p>'}
function mobileForm(token){const p=state.people.find(x=>x.token===token);if(!p)return layout(`<h1>受付情報が見つかりません</h1><p class="lead">QRコードの有効性を受付で確認してください。</p>`);layout(`<section class="hero"><div class="hero-mark">✓</div><h1>追加情報の登録</h1><p class="lead">${h(p.name)}さんの避難情報を登録します。</p></section><div class="panel"><label>携帯電話番号</label><input id="phone" type="tel" value="${h(p.phone||'')}"><label>一緒に避難している人数（本人を含む）</label><input id="party" type="number" min="1" value="${h(p.party||1)}"><label>現在の避難状況</label><select id="mstatus">${['避難所にいる','一時外出','車中泊','在宅避難','他の避難所へ移動','帰宅'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><label>避難生活で必要な支援</label><div class="checkrow">${['移動の支援','食事への配慮','乳幼児','妊産婦','高齢者への配慮','服薬・医療上の配慮','ペット同行'].map((x,i)=>`<label><input type="checkbox" name="need" value="${x}" ${(p.needs||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label>その他、受付に伝えたいこと</label><textarea id="note">${h(p.note||'')}</textarea></div><p class="notice">支援に必要な情報だけを入力してください。入力したくない項目は空欄のままで構いません。</p><button class="btn big green" style="margin-top:18px" onclick="mobileSave('${h(token)}')">登録する</button>`)}
function mobileSave(token){const p=state.people.find(x=>x.token===token);p.phone=$('#phone').value;p.party=Math.max(1,+$('#party').value||1);p.status=$('#mstatus').value;p.needs=[...document.querySelectorAll('[name=need]:checked')].map(x=>x.value);p.note=$('#note').value;p.detail=true;p.updatedAt=new Date().toISOString();save();layout(`<div class="panel ok" style="margin-top:60px;text-align:center"><div style="font-size:3rem">✓</div><h1>登録しました</h1><p class="lead">ご協力ありがとうございます。<br>内容は避難所の受付情報に反映されました。</p></div>`)}
function people(){layout(`<h1>避難者</h1><p class="lead">この端末で受け付けた方</p><h2>${state.people.length}名を受付</h2><div class="list">${state.people.length?state.people.map(p=>`<div class="panel person"><div><b>${h(p.name)}</b> <span class="badge ${p.detail?'green':''}">${p.detail?'詳細登録済':'基本受付'}</span><small>${h(p.status)} ・ ${new Date(p.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small>${p.needs?.length?`<small>支援：${h(p.needs.join('、'))}</small>`:''}</div><b>${p.party||1}人</b></div>`).join(''):'<div class="panel muted">まだ受付はありません。</div>'}</div>`)}
function summary(){const total=state.people.reduce((a,p)=>a+(p.party||1),0),detail=state.people.filter(p=>p.detail).length,need=state.people.filter(p=>p.needs?.length).length;const counts={};state.people.forEach(p=>counts[p.status]=(counts[p.status]||0)+(p.party||1));layout(`<h1>避難所の状況</h1><p class="lead">現在の受付情報をまとめています。</p><h2>サマリー</h2><div class="stats"><div class="stat"><b>${total}</b><small>登録人数</small></div><div class="stat"><b>${state.people.length}</b><small>受付件数</small></div><div class="stat"><b>${need}</b><small>支援情報あり</small></div></div><h2>避難状況</h2><div class="panel">${Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<div class="person" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span>${h(k)}</span><b>${v}人</b></div>`).join(''):'<p class="muted">データがありません。</p>'}</div><h2>追加登録</h2><div class="panel"><div class="kv"><div>登録済</div><b>${detail}件</b><div>未登録</div><b>${state.people.length-detail}件</b></div></div><p class="danger-note">PoC版：データはブラウザのlocalStorageに保存されています。本番では暗号化・権限管理されたサーバーとオフライン同期へ置き換えます。</p>`)}
render();
</script></body></html>
