		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}

		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};

	QRMath.EXP_TABLE[i] = 1 << i;
}

	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

}

	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},

		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

};

function manualStart(){draft={source:'手入力'};layout(`${steps(1)}<h1>基本情報を入力</h1><p class="lead">受付に必要な最低限の情報を入力します。</p><div class="panel"><label>氏名</label><input id="name" autocomplete="name"><label>住所</label><input id="address" autocomplete="street-address"><div class="two"><div><label>生年月日</label><input id="birth" type="date"></div><div><label>性別</label><select id="sex"><option value="">選択しない</option><option>男性</option><option>女性</option><option>その他・回答しない</option></select></div></div></div><button class="btn big" onclick="manualNext()">確認へ</button>`)}
function manualNext(){draft={name:$('#name').value.trim(),address:$('#address').value.trim(),birth:$('#birth').value,sex:$('#sex').value,source:'手入力'};if(!draft.name)return alert('氏名を入力してください');confirmBasic()}
function confirmBasic(){layout(`${steps(2)}<h1>受付内容を確認</h1><p class="lead">内容を確認して受付を完了してください。</p><div class="panel ticket"><span class="badge">${h(draft.source)}</span><div class="kv" style="margin-top:12px"><div>氏名</div><b>${h(draft.name)}</b><div>住所</div><span>${h(draft.address||'—')}</span><div>生年月日</div><span>${h(draft.birth||'—')}</span><div>性別</div><span>${h(draft.sex||'—')}</span></div></div><div class="panel"><label>現在の避難状況</label><select id="status"><option>避難所にいる</option><option>車中泊</option><option>在宅避難</option></select></div><button class="btn big green" onclick="complete()">受付を完了する</button><button class="btn ghost big" style="margin-top:10px" onclick="${draft.origin==='demo'?'home()':(draft.source==='手入力'?'manualStart()':'cardStart()')}">戻る</button>`)}
function complete(){const p={id:uid(),token:uid().replaceAll('-',''),...draft,status:$('#status').value,createdAt:new Date().toISOString(),detail:false};state.people.unshift(p);save();done(p)}
function done(p){layout(`${steps(3)}<div class="panel ok"><h2>✓ 受付が完了しました</h2><p><b>${h(p.name)}さん</b></p><p class="muted">受付番号 ${h(p.id.slice(0,8).toUpperCase())}</p></div><h2>詳しい情報を登録</h2><p class="lead">お手持ちのスマートフォンでQRコードを読み取ると、同行者や支援に必要な情報を登録できます。</p><div class="qrbox"><canvas id="qr"></canvas><p class="muted" style="margin-top:8px">追加登録は後からでもできます</p></div><p class="notice">QRコードに氏名・住所・マイナンバーは含めません。受付用の一時トークンのみを使用します。</p><button class="btn big" style="margin-top:18px" onclick="home()">次の方を受付</button>`);const url=location.href.split('?')[0]+'?token='+encodeURIComponent(p.token);try{EmbeddedQR.draw($('#qr'),url,230)}catch(e){console.error(e);$('#qr').outerHTML='<p class="err">QRコードを生成できませんでした</p>'}}
function mobileForm(token){const p=state.people.find(x=>x.token===token);if(!p)return layout(`<h1>受付情報が見つかりません</h1><p class="lead">QRコードの有効性を受付で確認してください。</p>`);layout(`<section class="hero"><div class="hero-mark">✓</div><h1>追加情報の登録</h1><p class="lead">${h(p.name)}さんの避難情報を登録します。</p></section><div class="panel"><label>携帯電話番号</label><input id="phone" type="tel" value="${h(p.phone||'')}"><label>一緒に避難している人数（本人を含む）</label><input id="party" type="number" min="1" value="${h(p.party||1)}"><label>現在の避難状況</label><select id="mstatus">${['避難所にいる','一時外出','車中泊','在宅避難','他の避難所へ移動','帰宅'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select><label>避難生活で必要な支援</label><div class="checkrow">${['移動の支援','食事への配慮','乳幼児','妊産婦','高齢者への配慮','服薬・医療上の配慮','ペット同行'].map((x,i)=>`<label><input type="checkbox" name="need" value="${x}" ${(p.needs||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><label>その他、受付に伝えたいこと</label><textarea id="note">${h(p.note||'')}</textarea></div><p class="notice">支援に必要な情報だけを入力してください。入力したくない項目は空欄のままで構いません。</p><button class="btn big green" style="margin-top:18px" onclick="mobileSave('${h(token)}')">登録する</button>`)}
function mobileSave(token){const p=state.people.find(x=>x.token===token);p.phone=$('#phone').value;p.party=Math.max(1,+$('#party').value||1);p.status=$('#mstatus').value;p.needs=[...document.querySelectorAll('[name=need]:checked')].map(x=>x.value);p.note=$('#note').value;p.detail=true;p.updatedAt=new Date().toISOString();save();layout(`<div class="panel ok" style="margin-top:60px;text-align:center"><div style="font-size:3rem">✓</div><h1>登録しました</h1><p class="lead">ご協力ありがとうございます。<br>内容は避難所の受付情報に反映されました。</p></div>`)}
function people(){layout(`<h1>避難者</h1><p class="lead">この端末で受け付けた方</p><h2>${state.people.length}名を受付</h2><div class="list">${state.people.length?state.people.map(p=>`<div class="panel person"><div><b>${h(p.name)}</b> <span class="badge ${p.detail?'green':''}">${p.detail?'詳細登録済':'基本受付'}</span><small>${h(p.status)} ・ ${new Date(p.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small>${p.needs?.length?`<small>支援：${h(p.needs.join('、'))}</small>`:''}</div><b>${p.party||1}人</b></div>`).join(''):'<div class="panel muted">まだ受付はありません。</div>'}</div>`)}
function summary(){const total=state.people.reduce((a,p)=>a+(p.party||1),0),detail=state.people.filter(p=>p.detail).length,need=state.people.filter(p=>p.needs?.length).length;const counts={};state.people.forEach(p=>counts[p.status]=(counts[p.status]||0)+(p.party||1));layout(`<h1>避難所の状況</h1><p class="lead">現在の受付情報をまとめています。</p><h2>サマリー</h2><div class="stats"><div class="stat"><b>${total}</b><small>登録人数</small></div><div class="stat"><b>${state.people.length}</b><small>受付件数</small></div><div class="stat"><b>${need}</b><small>支援情報あり</small></div></div><h2>避難状況</h2><div class="panel">${Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<div class="person" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span>${h(k)}</span><b>${v}人</b></div>`).join(''):'<p class="muted">データがありません。</p>'}</div><h2>追加登録</h2><div class="panel"><div class="kv"><div>登録済</div><b>${detail}件</b><div>未登録</div><b>${state.people.length-detail}件</b></div></div><p class="danger-note">PoC版：データはブラウザのlocalStorageに保存されています。本番では暗号化・権限管理されたサーバーとオフライン同期へ置き換えます。</p>`)}
render();
</script></body></html>
